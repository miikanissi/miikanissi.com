name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Hugo version
        id: hugo-version
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo (extended, pinned)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Install lychee
        run: |
          curl -sL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin lychee-x86_64-unknown-linux-gnu/lychee --strip-components=1
          lychee --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: make check

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          if-no-files-found: ignore

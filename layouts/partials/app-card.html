{{- $icon := .Resources.GetMatch "icon*" }}
<div class="card app-card">
    {{- with $icon }}
    <img class="app-icon" src="{{ .RelPermalink }}" alt="" width="64" height="64">
    {{- end }}
    <h3><a class="card-link" href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Params.summary }}</p>
    <div class="tags">
        {{- range .Params.odoo_versions }}
        <span class="version-tag">Odoo {{ . }}</span>
        {{- end }}
    </div>
    <p class="app-price">{{ .Params.currency | default "USD" }} {{ printf "%.2f" (float .Params.price) }}</p>
    <div class="actions">
        <a class="btn btn-primary" href="{{ .RelPermalink }}">About {{ .Title }}</a>
        <a class="btn btn-secondary" href="{{ .Params.store_url }}" target="_blank" rel="noopener">Buy on Odoo Apps</a>
    </div>
</div>

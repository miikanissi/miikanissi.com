<header class="site-header">
    {{- $wordmark := resources.Get "brand/wordmark-full-colour.svg" | fingerprint }}
    {{- $wordmarkDark := resources.Get "brand/wordmark-reverse-white.svg" | fingerprint }}
    <a href="{{ "/" | relLangURL }}" class="wordmark" aria-label="{{ .Site.Title }}, home">
        <picture>
            <source srcset="{{ $wordmarkDark.RelPermalink }}" media="(prefers-color-scheme: dark)">
            <img src="{{ $wordmark.RelPermalink }}" alt="{{ .Site.Params.brand }}" width="140" height="36">
        </picture>
    </a>
    <nav class="site-nav" aria-label="Primary">
        <ul>
            {{- range .Site.Menus.main }}
            <li><a href="{{ .URL }}"{{ if hasPrefix $.RelPermalink .URL }} aria-current="{{ if eq $.RelPermalink .URL }}page{{ else }}true{{ end }}"{{ end }}>{{ .Name }}</a></li>
            {{- end }}
        </ul>
    </nav>
    <a class="btn btn-primary header-cta" href="mailto:{{ .Site.Params.email }}">Contact</a>
</header>

<footer class="site-footer">
    {{- $icon := resources.Get "brand/icon-full-colour.svg" | fingerprint }}
    <div class="footer-row">
        <img class="footer-mark" src="{{ $icon.RelPermalink }}" alt="" width="20" height="20">
        <ul class="footer-links">
            <li><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></li>
            {{- range .Site.Menus.footer }}
            <li><a href="{{ .URL }}"{{ if strings.HasPrefix .URL "http" }} rel="me noopener" target="_blank"{{ end }}>{{ .Name }}</a></li>
            {{- end }}
        </ul>
    </div>
    <div class="footer-row footer-meta">
        <p>{{ replace .Site.Params.copyright "{year}" now.Year }}. Posts are <a href="{{ .Site.Params.license }}" rel="license">CC BY 4.0</a>.</p>
        <ul class="footer-links">
            <li><a href="{{ "/privacy/" | relLangURL }}">Privacy</a></li>
            <li><a href="{{ .Site.Params.source }}">Website source code</a></li>
        </ul>
    </div>
</footer>

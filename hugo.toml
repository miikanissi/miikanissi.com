baseURL = "https://miikanissi.com/"
locale = "en-US"
title = "Miika Nissi"
enableInlineShortcodes = true
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term']
disableHugoGeneratorInject = true

[module.hugoVersion]
  min = "0.166.0"
  extended = true

[markup.highlight]
  noClasses = false

[params]
  author = "Miika Nissi"
  email = "miika@miikanissi.com"
  brand = "m.nissi"
  title = "Miika Nissi"
  logo = "favicon-32x32.png"
  description = "Personal website of Miika Nissi — a technology blog focused on Linux configuration, programming, development tools, and the Unix philosophy."
  copyright = "Copyright © 2020-{year} Miika Nissi"
  dark = "auto"
  highlight = true

[menu]
  # Apps and Blog land in the "Pages and content" step, once /apps/ and
  # /blog/ exist; Services points at the current URL until it moves to
  # /services/ in that same step.
  [[menu.main]]
    identifier = "services"
    name = "Services"
    title = "Services"
    url = "/odoo-development-services/"
    weight = 10

  [[menu.main]]
    identifier = "about"
    name = "About"
    title = "About"
    url = "/about/"
    weight = 40

  [[menu.footer]]
    identifier = "github"
    name = "GitHub"
    title = "GitHub"
    url = "https://github.com/miikanissi"
    weight = 10

  [[menu.footer]]
    identifier = "gitlab"
    name = "GitLab"
    title = "GitLab"
    url = "https://gitlab.com/miikanissi"
    weight = 20

  [[menu.footer]]
    identifier = "rss"
    name = "RSS"
    title = "RSS"
    url = "/index.xml"
    weight = 30

[permalinks]
  posts = "/blog/:filename/"

[markup.goldmark.renderer]
  # Allow HTML in Markdown
  unsafe = true

  [markup.tableOfContents]
    ordered = true
    endLevel = 4

[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.6

[minify]
  [minify.tdewolff.html]
    keepQuotes = true
